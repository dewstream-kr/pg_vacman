# =========================================================
# pg_vacman configuration
# Environment: Production
# Timezone: Asia/Seoul
# =========================================================


# =========================================================
# Database connection
# =========================================================
db:
  # PostgreSQL endpoint used by pg_vacman.
  # This connection is also used as the control connection.
  host: "127.0.0.1"
  port: 5432

  # Control database name.
  # Usually "postgres" is sufficient.
  dbname: "postgres"

  # Login role used by pg_vacman.
  user: "postgres"
  password: "password"

  # Connection timeout for each connection attempt.
  connect_timeout_sec: 5

  # Base application_name shown in pg_stat_activity.
  # Suffixes such as :control / :worker are appended automatically.
  application_name: "pg_vacman"


# =========================================================
# Target database discovery
# =========================================================
targets:
  # If empty, databases are discovered from pg_database.
  # If not empty, only listed databases are processed.
  include_databases: []

  # Databases to always exclude.
  exclude_databases: ["template0", "template1"]

  # Exclude template databases during discovery.
  exclude_templates: true

  # Only include databases with datallowconn = true.
  require_allow_conn: true

  # Maximum number of databases processed per run.
  # 0 means unlimited.
  max_databases_per_run: 0

  # Skip databases in recovery mode.
  # Recommended for production safety.
  primary_only: true


# =========================================================
# Run behavior
# =========================================================
run:
  # Advisory lock key used to prevent overlapping runs.
  advisory_lock_key: 90421001

  # Timezone used for timestamps and time-window logic.
  timezone: "Asia/Seoul"

  # Default mode when neither --dry-run nor --apply is specified.
  # Keep true for safer operation.
  dry_run_default: true

  # Logging level: debug / info / warning / error
  log_level: "info"

  # JSON report verbosity.
  # basic   = smaller output
  # verbose = includes detailed decisions and skipped objects
  json_detail_level: "verbose"

  # Maximum number of filtered/skipped objects recorded per DB in verbose mode.
  json_max_skips_per_db: 30

  # Automatically save JSON report if --json-out is not specified.
  json_auto_save: true
  json_out_dir: "./runs"
  json_out_prefix: "run"

  # Maximum number of action rows included per DB in notifications.
  notify_max_actions_per_db: 30

  # Include executed SQL in notifications.
  # Keep false unless debugging is required.
  notify_include_sql: false


# =========================================================
# Maintenance decision thresholds
# =========================================================
thresholds:
  # Skip tables smaller than this size in MB.
  min_table_size_mb: 64

  # Schedule VACUUM when dead tuple ratio is at or above this value.
  min_dead_ratio: 0.15

  # ANALYZE staleness threshold in hours.
  max_analyze_age_hours: 72

  # VACUUM staleness threshold in hours.
  max_last_vacuum_age_hours: 168

  # Freeze guardrail based on age(relfrozenxid).
  freeze_age_threshold: 1500000000

  vacuum_full:
    # VACUUM FULL is disabled by default in production.
    enabled: false

    # Allowed local time window for VACUUM FULL.
    start: "01:00"
    end: "05:00"

    # Additional conditions for VACUUM FULL planning.
    min_dead_ratio: 0.60
    min_table_size_mb: 2048


# =========================================================
# Execution limits and pacing
# =========================================================
limits:
  # Maximum number of planned actions per DB.
  # 0 means unlimited.
  max_tables_per_db: 30

  # Maximum number of planned actions across the entire run.
  # 0 means unlimited.
  max_actions_global: 200

  # Parallel workers per DB.
  parallel_tables_per_db: 1

  # Global parallel worker limit across all DBs.
  global_parallel_limit: 2

  # Delay between table actions and database loops.
  sleep_between_tables_sec: 0.2
  sleep_between_databases_sec: 0.8

  # Session safety timeouts.
  lock_timeout_ms: 2000
  per_table_statement_timeout_sec: 1800

  # Vacuum cost settings to reduce IO pressure.
  vacuum_cost_delay_ms: 2
  vacuum_cost_limit: 2000


# =========================================================
# Candidate filtering
# =========================================================
filters:
  # If empty, all user schemas are considered except excluded ones.
  include_schemas: []

  # Explicitly excluded schemas.
  exclude_schemas: ["pg_catalog", "information_schema"]

  # Object pattern filters.
  # Pattern format:
  #   "db:schema.table"
  #   "schema.table"  -> treated as "*:schema.table"
  include_objects: []

  exclude_objects:
    # Example protection rule.
    - "*:public.do_not_touch"

  # Legacy compatibility keys.
  include_tables: []
  exclude_tables: []


# =========================================================
# Force policy
# =========================================================
force:
  # Enable only when specific tables must bypass thresholds.
  enabled: false

  # Default forced action for plain string patterns.
  default_action: "ANALYZE"

  # Forced table patterns.
  tables: []
  # Example:
  # tables:
  #   - "*:public.insert_only_*"
  #   - pattern: "db1:public.append_only_*"
  #     action: "VACUUM_FREEZE_ANALYZE"


# =========================================================
# Precheck policy
# =========================================================
precheck:
  # Enable best-effort checks before execution.
  enabled: true

  # Skip if autovacuum/autoanalyze is already active on the same relation.
  skip_if_autovacuum_running: true

  # Skip if another regular VACUUM is already running on the same relation.
  skip_if_vacuum_running: false

  # Skip if another ANALYZE is already running on the same relation.
  skip_if_analyze_running: false

  # Skip VACUUM FULL if locks already exist on the target relation.
  skip_vacuum_full_if_relation_locked: true


# =========================================================
# VACUUM FULL guardrails
# =========================================================
vacuum_full_policy:
  # Enable additional safety control for VACUUM FULL.
  enabled: true

  # Allowlist for VACUUM FULL targets.
  # If empty while enabled=true, all VACUUM FULL requests are blocked
  # and handled according to on_miss.
  allow_objects: []

  # Action when VACUUM FULL target is not allowlisted.
  # Supported values: VACUUM_ANALYZE, SKIP
  on_miss: "VACUUM_ANALYZE"

  # If true, a force rule can bypass this allowlist.
  # Keep false for production safety.
  force_bypass: false


# =========================================================
# Retry / backoff policy
# =========================================================
retry:
  # Enable retry for deferrable failures.
  enabled: true

  # Base retry policy.
  max_attempts: 2
  base_sleep_ms: 300
  max_sleep_ms: 3000
  jitter_ms: 200

  # Retryable categories.
  retryable_categories:
    - lock_timeout
    - lock_not_available
    - statement_timeout
    - deadlock_detected
    - serialization_failure
    - query_canceled

  # Override rules are applied in order.
  overrides:
    # Disable retry during business hours.
    - db_pattern: "*"
      start: "09:00"
      end: "23:00"
      enabled: false

    # Increase retry during night maintenance window.
    - db_pattern: "*"
      start: "23:00"
      end: "09:00"
      enabled: true
      max_attempts: 3
      base_sleep_ms: 500
      max_sleep_ms: 5000
      jitter_ms: 250

    # Keep VACUUM FULL retry to minimum.
    - db_pattern: "*"
      action_pattern: "VACUUM_FULL_ANALYZE"
      max_attempts: 1


# =========================================================
# Notifications
# =========================================================
notify:
  # Slack Incoming Webhook URL.
  slack_webhook_url: "https://hooks.slack.com/services/xxxxxxxxxxxxxxxx"

  # Telegram bot settings.
  telegram_bot_token: ""
  telegram_chat_id: ""